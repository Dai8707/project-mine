plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = findProperty('modularGroup') ?: 'com.modularhub'
version = findProperty('modularVersion') ?: '1.0.0'

android {
    namespace 'com.modularhub.feature.mine'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
    publishing { singleVariant('release') }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group.toString()
                artifactId = findProperty('modularArtifact') ?: 'feature-mine'
                version = project.version.toString()
            }
        }
        repositories {
            mavenLocal()
            maven {
                name = 'GitHubPackages'
                url = uri(findProperty('modularMavenUrl') ?: 'https://maven.pkg.github.com/Dai8707/ModularHub-Android')
                credentials {
                    username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR') ?: ''
                    password = findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN') ?: ''
                }
            }
        }
    }
}
